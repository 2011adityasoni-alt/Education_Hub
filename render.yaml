# Render Blueprint: API only. Next.js admin/teacher panels are added in Phase 6.
# Database lives on Neon (or similar); DATABASE_URL is entered in the Render dashboard, never committed.
services:
  - type: web
    name: eduhub-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
